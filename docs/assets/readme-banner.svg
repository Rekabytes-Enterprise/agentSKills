<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Reka Bytes Agent Skills</title>
  <desc id="banner-desc">Plan deliberately. Build confidently. Portable workflows move from planning and PRDs to approved project configuration, implementation, and verification.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a35"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 H 0 V 36" fill="none" stroke="#a5b4fc" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#background)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="1050" cy="145" rx="380" ry="310" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="#a5b4fc" stroke-opacity="0.16"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="48" width="7" height="7" rx="2" fill="#818cf8"/>
    <text x="85" y="57" fill="#a5b4fc" font-size="13" font-weight="600" letter-spacing="2.2">REKA BYTES / AGENT SKILLS</text>
    <text x="64" y="145" fill="#f8fafc" font-size="54" font-weight="700" letter-spacing="-1.8">Plan deliberately.</text>
    <text x="64" y="210" fill="#a5b4fc" font-size="54" font-weight="700" letter-spacing="-1.8">Build confidently.</text>
    <text x="66" y="254" fill="#94a3b8" font-size="17">Portable workflows. Real project context. Your approval.</text>
    <text x="66" y="312" fill="#64748b" font-size="12" letter-spacing="1.6">RESEARCH FIRST. APPROVAL FIRST. PROJECT AWARE.</text>
    <rect x="819" y="44" width="374" height="266" rx="18" fill="#0b1020" fill-opacity="0.52" stroke="#818cf8" stroke-opacity="0.2"/>
    <text x="843" y="76" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.8">A BETTER DELIVERY WORKFLOW</text>
    <path d="M 867 125 V 250" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="841" y="94" width="330" height="54" rx="10" fill="#171e37" stroke="#818cf8" stroke-opacity="0.2"/>
    <circle cx="867" cy="121" r="12" fill="#6366f1" fill-opacity="0.18"/>
    <path d="M 862 117 H 872 M 862 121 H 872 M 862 125 H 868" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
    <text x="891" y="117" fill="#e2e8f0" font-size="15" font-weight="600">Plan and define</text>
    <text x="891" y="134" fill="#94a3b8" font-size="11">PRDs, phases, and UAT requirements</text>
    <rect x="841" y="163" width="330" height="54" rx="10" fill="#171e37" stroke="#818cf8" stroke-opacity="0.2"/>
    <circle cx="867" cy="190" r="12" fill="#6366f1" fill-opacity="0.18"/>
    <path d="M 861 190 L 865 194 L 873 186" fill="none" stroke="#a5b4fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="891" y="186" fill="#e2e8f0" font-size="15" font-weight="600">Research and approve</text>
    <text x="891" y="203" fill="#94a3b8" font-size="11">Choices that fit your actual stack</text>
    <rect x="841" y="232" width="330" height="54" rx="10" fill="#171e37" stroke="#818cf8" stroke-opacity="0.2"/>
    <circle cx="867" cy="259" r="12" fill="#6366f1" fill-opacity="0.18"/>
    <path d="M 864 255 L 860 259 L 864 263 M 870 255 L 874 259 L 870 263" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="891" y="255" fill="#e2e8f0" font-size="15" font-weight="600">Build and verify</text>
    <text x="891" y="272" fill="#94a3b8" font-size="11">Scoped implementation with evidence</text>
  </g>
</svg>
